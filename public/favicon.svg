<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A city pop sunset: a striped sun going down behind a low skyline. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047" />
      <stop offset="0.5" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <clipPath id="tile">
      <rect width="32" height="32" rx="7" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#1e1b4b" />
    <circle cx="16" cy="14.5" r="11" fill="url(#sun)" />
    <!-- Stripes across the sun's lower half, wider as they go down. -->
    <g fill="#1e1b4b">
      <rect x="4" y="15.5" width="24" height="1.3" />
      <rect x="4" y="18.6" width="24" height="1.8" />
      <rect x="4" y="22.2" width="24" height="2.4" />
    </g>
    <!-- A low skyline, one tower. -->
    <path fill="#0b0a24" d="M0 32V26h3v-2h3v3h3v-5h3v4h3v-8h2v8h3v-3h3v2h3v-4h3v5h2V32z" />
  </g>
</svg>
