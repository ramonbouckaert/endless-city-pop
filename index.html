<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless City Pop</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body>
    <main>
      <section class="song" aria-live="polite">
        <div class="song-head">
          <div class="song-name">
            <h2 id="title">…</h2>
            <p class="meta">
              <span id="meta"></span> · <span id="position" class="clock">0:00</span> -
              <span id="length" class="clock"></span>
            </p>
          </div>
          <div class="actions">
            <button type="button" id="generate" class="icon-button" title="New song" aria-label="New song">
              <svg class="line-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66" />
                <path d="M20 4v5h-5" />
              </svg>
            </button>
            <!-- Play while stopped, Stop while playing (body.playing). -->
            <button type="button" class="primary" id="play">
              <span class="when-stopped">▶ Play</span>
              <span class="when-playing">■ Stop</span>
              <span class="when-loading">Loading sounds…</span>
            </button>
            <button type="button" id="midi" title="Download this song as a MIDI file" aria-label="Export as MIDI">
              <span class="icon" aria-hidden="true">
                <svg class="line-icon" viewBox="0 0 24 24" width="16" height="16">
                  <path d="M12 4v11" />
                  <path d="M7 10l5 5 5-5" />
                  <path d="M4 17v3h16v-3" />
                </svg>
              </span>
              <span class="label">Export as MIDI</span>
            </button>
            <label class="toggle" title="Play a new song when this one ends">
              <input type="checkbox" id="autoplay" checked />
              Autoplay
            </label>
          </div>
        </div>
        <div class="timeline">
          <ol id="form" class="form" aria-label="Song form"></ol>
          <div id="playhead" class="playhead" aria-hidden="true" hidden></div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
    </main>

    <footer>
      <p>
        Procedurally generated city pop, played on the
        <a href="https://www.schristiancollins.com/generaluser.php" target="_blank" rel="noopener">GeneralUser GS</a>
        soundfont by S. Christian Collins with
        <a href="https://github.com/spessasus/spessasynth_lib" target="_blank" rel="noopener">SpessaSynth</a>.
        <a href="licenses/index.html">Licences</a>.
      </p>
      <p>
        Created with a lot of help from
        <a href="https://claude.com/claude-code" target="_blank" rel="noopener">Claude Code</a>, source code available
        <a href="https://github.com/ramonbouckaert/endless-city-pop" target="_blank" rel="noopener">here</a>.
      </p>
    </footer>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
