<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strudel Songsmith</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Strudel Songsmith</h1>
        <p>
          Jazz-funk songs in major, minor and modal keys, from music theory, played by
          <a href="https://strudel.cc" target="_blank" rel="noopener">Strudel</a>
        </p>
      </div>
    </header>

    <main>
      <section class="song" aria-live="polite">
        <div class="song-head">
          <div>
            <h2 id="title">…</h2>
            <p id="meta" class="meta"></p>
          </div>
          <div class="actions">
            <button type="button" id="generate" title="Write a new song">Generate</button>
            <button type="button" class="primary" id="play">▶ Play</button>
            <button type="button" id="stop">■ Stop</button>
            <button type="button" id="midi" title="Download this song as a MIDI file">⬇ Export as MIDI</button>
            <label class="toggle" title="Play a new song when this one ends">
              <input type="checkbox" id="autoplay" checked />
              Autoplay
            </label>
          </div>
        </div>
        <div class="timeline">
          <ol id="form" class="form" aria-label="Song form"></ol>
          <div id="playhead" class="playhead" aria-hidden="true" hidden></div>
        </div>
        <p id="status" class="status"></p>
      </section>

      <section id="debug" class="debug" hidden></section>
    </main>

    <footer>
      Built on <a href="https://codeberg.org/uzu/strudel" target="_blank" rel="noopener">Strudel</a> (AGPL-3.0).
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
