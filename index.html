<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless City Pop</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Fullwidth Roman letters (titles like Ｃｉｔｙ　Ｐｏｐ) in a Japanese serif: just those glyphs. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&amp;text=%EF%BC%A1%EF%BC%A2%EF%BC%A3%EF%BC%A4%EF%BC%A5%EF%BC%A6%EF%BC%A7%EF%BC%A8%EF%BC%A9%EF%BC%AA%EF%BC%AB%EF%BC%AC%EF%BC%AD%EF%BC%AE%EF%BC%AF%EF%BC%B0%EF%BC%B1%EF%BC%B2%EF%BC%B3%EF%BC%B4%EF%BC%B5%EF%BC%B6%EF%BC%B7%EF%BC%B8%EF%BC%B9%EF%BC%BA%EF%BD%81%EF%BD%82%EF%BD%83%EF%BD%84%EF%BD%85%EF%BD%86%EF%BD%87%EF%BD%88%EF%BD%89%EF%BD%8A%EF%BD%8B%EF%BD%8C%EF%BD%8D%EF%BD%8E%EF%BD%8F%EF%BD%90%EF%BD%91%EF%BD%92%EF%BD%93%EF%BD%94%EF%BD%95%EF%BD%96%EF%BD%97%EF%BD%98%EF%BD%99%EF%BD%9A%E3%80%80&amp;display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <section class="song" aria-live="polite">
        <div class="song-head">
          <div class="song-name">
            <h2 id="title">…</h2>
            <p class="meta">
              <span id="meta"></span> · <span id="position" class="clock">0:00</span> -
              <span id="length" class="clock"></span>
            </p>
          </div>
          <div class="actions">
            <button type="button" id="generate" class="icon-button" title="New song" aria-label="New song">
              <svg class="line-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66" />
                <path d="M20 4v5h-5" />
              </svg>
            </button>
            <!-- Play while stopped, Stop while playing (body.playing). -->
            <button type="button" class="primary" id="play">
              <span class="when-stopped">▶ Play</span>
              <span class="when-playing">■ Stop</span>
            </button>
            <button type="button" id="midi" title="Download this song as a MIDI file" aria-label="Export as MIDI">
              <span class="icon" aria-hidden="true">
                <svg class="line-icon" viewBox="0 0 24 24" width="16" height="16">
                  <path d="M12 4v11" />
                  <path d="M7 10l5 5 5-5" />
                  <path d="M4 17v3h16v-3" />
                </svg>
              </span>
              <span class="label">Export as MIDI</span>
            </button>
            <label class="toggle" title="Play a new song when this one ends">
              <input type="checkbox" id="autoplay" checked />
              Autoplay
            </label>
          </div>
        </div>
        <div class="timeline">
          <ol id="form" class="form" aria-label="Song form"></ol>
          <div id="playhead" class="playhead" aria-hidden="true" hidden></div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section id="debug" class="debug" hidden></section>
    </main>

    <footer>
      Procedurally generated city pop, built on
      <a href="https://codeberg.org/uzu/strudel" target="_blank" rel="noopener">Strudel</a> (AGPL-3.0). Created with a
      lot of help from <a href="https://claude.com/claude-code" target="_blank" rel="noopener">Claude Code</a>, source
      code available
      <a href="https://github.com/ramonbouckaert/endless-city-pop" target="_blank" rel="noopener">here</a>.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
